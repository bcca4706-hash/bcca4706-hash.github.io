name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web:
    name: Web build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  android:
    name: Android AAB (imzalı)
    runs-on: ubuntu-latest
    needs: web
    # Keystore secret'ları tanımlıysa çalışır
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
      - name: Capacitor android platformunu ekle (yoksa)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Keystore çöz
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
      - name: AAB derle
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/upload.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
